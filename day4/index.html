    <header>

```
<main>
    <section class="notes-container">
        <h2>My Notes</h2>

        <label for="note-text">Write your notes:</label>
        <textarea
            id="note-text"
            rows="10"
            maxlength="200"
            placeholder="Start typing your notes here..."
        ></textarea>

        <div class="counter-container">
            <p id="char-count">0 / 200 characters</p>
            <p id="word-count">0 words</p>
        </div>

        <div class="button-container">
            <button id="clear-btn" type="button">Clear</button>
            <button id="theme-toggle" type="button">Dark mode</button>
        </div>
    </section>
</main>

<footer>
    <p>&copy; 2026 Notes Toolkit</p>
</footer>
